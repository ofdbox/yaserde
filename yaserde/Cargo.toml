[package]
name = "ofdbox-yaserde"
version = "0.13.1"
authors = ["Marc-Antoine Arnaud <arnaud.marcantoine@gmail.com>"]
description = "Serialization and deserialization library"
keywords = ["Serialization", "Deserialization", "XML"]
license = "MIT"
repository = "https://github.com/luminvent/yaserde"
homepage = "https://github.com/luminvent/yaserde"
documentation = "https://docs.rs/ofdbox-yaserde"
readme = "../README.md"
edition.workspace = true
rust-version.workspace = true

[features]
derive = ["dep:ofdbox-yaserde-derive"]

[dependencies]
ofdbox-yaserde-derive = { version = "0.13.1", path = "../yaserde_derive", optional = true }
xml = "1.4.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11.0"
ofdbox-yaserde-derive = { version = "0.13.1", path = "../yaserde_derive" }
